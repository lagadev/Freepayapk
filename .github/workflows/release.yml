name: Build FreePay Sync APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (e.g. android-v1.0.0)"
        required: false
        default: ""
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Dump dependency tree on failure
        if: failure()
        run: |
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath > deps.txt 2>&1 || true
          echo "----- gradle cache search for material/cardview AARs -----"
          find ~/.gradle/caches -iname "*material*" -o -iname "*cardview*" 2>/dev/null | head -20 > cache_search.txt || true
          echo "----- deps.txt head -----"
          head -60 deps.txt > deps_head.txt || true

      - name: Show error tail on failure
        if: failure()
        run: |
          echo "----- resource link errors -----"
          grep -n -i "error:" build.log > grep_errors.txt || true
          echo "----- cache search result -----"
          cat cache_search.txt 2>/dev/null > combined.txt || touch combined.txt
          echo "----- deps head -----" >> combined.txt
          cat deps_head.txt 2>/dev/null >> combined.txt || true
          echo "----- first 15 resource errors -----" >> combined.txt
          head -15 grep_errors.txt >> combined.txt || true
          COMBINED=$(cat combined.txt | tail -c 5500 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error::$COMBINED"

      - name: Rename artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk freepay-sync.apk

      - name: Determine release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=android-build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload build artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: freepay-sync-apk
          path: freepay-sync.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "FreePay Sync ${{ steps.tag.outputs.tag }}"
          body: |
            FreePay Sync Android app — auto-built by GitHub Actions.

            This is a **debug-signed APK** meant for direct install (sideload)
            on the phone that will read your bKash/Nagad/Upay/Rocket/Cellfin
            SMS. Enable "Install from unknown sources" for your browser/file
            manager to install it.
          files: freepay-sync.apk
          generate_release_notes: false
